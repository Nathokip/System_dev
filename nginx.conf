pid nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Keep temp directories writable by your current user instead of system /var/lib or /var/cache paths.
    client_body_temp_path nginx_temp/client_body;
    proxy_temp_path nginx_temp/proxy;
    fastcgi_temp_path nginx_temp/fastcgi;
    uwsgi_temp_path nginx_temp/uwsgi;
    scgi_temp_path nginx_temp/scgi;

    access_log access.log;
    error_log error.log;

    upstream rust_backends {
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
    }

    server {
        listen 8080;
        server_name localhost;

        location /api/ {
            proxy_pass http://rust_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}